name: Publicar RUTA CUPISSA (HTML, CSS, JS estaticos)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
      - name: Preparar sitio web estatico (sin Vite)
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp -r public/. dist/
          cp -r clientes dist/clientes
          cp -r js dist/js
          cp CNAME dist/CNAME
      - name: Publicar archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Activar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
