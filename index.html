button:hover{opacity:.85}button:active{transform:scale(.98)}

.leaflet-tile-pane{filter:grayscale(1) contrast(1.05)}#map{border:1px solid var(--tx)}
.pin{border-color:#000}.av{background:#000;color:#fff}

var nt,nmap,nw;let modalLocked=false;const openM=(h,opts={})=>{modalLocked=opts.dismissible===false;$('#modal>div').innerHTML='<button class="s" onclick="closeM()" style="float:right;position:sticky;top:0;z-index:9">✕</button>'+h;$('#modal').style.display='flex'},closeM=()=>{$('#modal').style.display='none';modalLocked=false;try{stm?.getTracks().forEach(t=>t.stop())}catch{}};

let stm,tmr,ip,sb,me,C=[],chan,map,poll;

async function inv(){let{data}=await sb.from('settings').select('value').eq('key','invite').maybeSingle();if(data)return data.value;const v=crypto.randomUUID().slice(0,12);await sb.from('settings').insert({key:'invite',value:v});return v}

init();

async function init(){try{await window.CUPISSA_NATIVE_READY;const opts=window.CUPISSA_FETCH?{global:{fetch:window.CUPISSA_FETCH}}:{};sb=supabase.createClient(cfg.u,cfg.k,opts);const{data:{session}}=await sb.auth.getSession();session?start(session.user):login()}catch(err){app.innerHTML='<div class="card narrow"><h2>No se pudo iniciar CUPISSA DOMIS</h2><p class="mu">Revisa tu conexión a internet e inténtalo de nuevo.</p></div>';console.error(err)}}

 if(r.error)return alert(r.error.message);if(!r.data.session)return alert('Revisa tu correo para confirmar (o desactiva la confirmación en Supabase).');start(r.data.user)}

function admin(){app.innerHTML=`<header><span><img src="logo/logo.png" height="28" style="vertical-align:middle" onerror="this.style.display='none'"> <b>Cupissa Domis</b></span><nav>${[['pedidos','Servicios'],['equipo','Equipo y mapa'],['jornadas','Jornadas'],['ahorro','Ahorro']].map(t=>`<button class="s" onclick="tab('${t[0]}')">${t[1]}</button>`).join('')}</nav><button class="s" onclick="out()">Salir</button></header><main id="m"></main>`;tab('pedidos')}
async function tab(t){clearInterval(tmr);if(chan){sb.removeChannel(chan);chan=0}if(map){map.remove();map=0}$('#m').innerHTML='Cargando…';await({pedidos,equipo,jornadas,ahorro})[t]()}
const copts=s=>`<option value="">Sin asignar</option>`+C.map(c=>`<option value="${c.id}" ${c.id==s?'selected':''}>${e(c.name)}</option>`).join('');

async function pedidos(){
 const[a,b]=await Promise.all([sb.from('profiles').select('id,name').eq('role','courier'),sb.from('orders').select('id,type,client_name,client_phone,address,description,total,courier_id,status,created_at,delivered_at').order('created_at',{ascending:false}).limit(60)]);
 C=a.data||[];const os=b.data||[];
 $('#m').innerHTML=`<section class="card"><div class="row"><h3>Nuevo servicio</h3><button class="rd" onclick="delall()">Borrar todos</button></div><form id="f"><div class="g">
 <select name="type" onchange="tg()">${Object.entries(TYPES).map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select>
 <input class="dom" name="name" placeholder="Nombre del cliente"><input class="dom" name="phone" placeholder="Teléfono" inputmode="tel">
 <input class="dom" name="address" placeholder="Dirección (o coordenadas 10.96,-74.78)" required>
 <input class="dom" name="total" type="number" placeholder="Total a cobrar" inputmode="numeric"><input name="cost" type="number" placeholder="🔒 Precio oculto (lo que pagarías)" inputmode="numeric">
 <select name="courier">${copts()}</select></div><textarea name="desc" placeholder="Detalle del pedido / mandado"></textarea><button>Crear servicio</button></form></section>
 ${os.map(o=>`<div class="card"><div class="row"><b>${TYPES[o.type]||o.type} · ${e(o.client_name)}</b><span class="chip">${ST[o.status]}</span></div>
 <div class="mu">${e(o.address)} · ${e(o.client_phone)}</div><div>${e(o.description)}</div>
 <div class="row"><b>${money(o.total)}</b><span class="mu">${fdt(o.created_at)}</span></div>
 <div class="row"><select style="width:auto" onchange="assign('${o.id}',this.value)">${copts(o.courier_id)}</select><button class="rd" onclick="delo('${o.id}')">🗑 Eliminar</button>${o.status=='entregado'?`<button class="s" onclick="evid('${o.id}')">Ver evidencia</button>`:`<button class="s" onclick="evid('${o.id}')">Ver comprobante</button>`}</div></div>`).join('')||'<p class="mu">Sin servicios aún.</p>'}`;
 tg();$('#f').onsubmit=async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));
  const g=d.address?await geo(d.address):null;const{data:o,error}=await sb.from('orders').insert({type:d.type,client_name:d.name||'',client_phone:d.phone||'',address:d.address||'',dest_lat:g?g[0]:null,dest_lng:g?g[1]:null,description:d.desc,total:+d.total||0,courier_id:d.courier||null,status:d.courier?'asignado':'pendiente'}).select('id').single();

 openM(`<h3>Evidencia</h3>${data.transfer_photo?`<p class="mu">Comprobante de transferencia</p><img src="${data.transfer_photo}">`:'<p class="mu">Sin comprobante</p>'}${data.photo?`<img src="${data.photo}">`:'<p class="mu">Sin foto</p>'}${data.signature?`<p class="mu">Firma del cliente</p><div style="background:#fff;border-radius:8px"><img src="${data.signature}"></div>`:'<p class="mu">Sin firma</p>'}<button onclick="closeM()">Cerrar</button>`)}

async function equipo(){
 const{data:cs}=await sb.from('profiles').select('id,name,phone,plate,avatar').eq('role','courier');C=cs||[];
 $('#m').innerHTML=`<div id="map"></div><p id="seen" class="mu"></p><section class="card"><h3>Nuevo domiciliario</h3><form id="f"><div class="g"><input name="name" placeholder="Nombre" required><input name="phone" placeholder="Teléfono"><input name="plate" placeholder="Placa del vehículo" style="text-transform:uppercase"><input name="email" type="email" placeholder="Correo" required><input name="pw" placeholder="Contraseña (mín. 6)" required></div><button>Crear domiciliario</button></form></section>
 ${C.map(c=>`<div class="card row"><span>${av(c)} <b>${e(c.name)}</b> <span class="mu">${e(c.phone)}</span><br><small class="mu" style="user-select:all">ID: ${c.id}</small></span><span><input id="pl${c.id}" value="${e(c.plate)}" placeholder="Placa" style="width:110px;text-transform:uppercase"> <button class="s" onclick="plate('${c.id}')">Guardar</button></span></div>`).join('')}`;
 map=L.map('map').setView([10.96,-74.78],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
 const mk={},tr={},seen={};let fit=0;
 const put=r=>{const c=C.find(x=>x.id==r.courier_id)||{name:'?'},p=[r.lat,r.lng];
  if(!mk[r.courier_id]){mk[r.courier_id]=L.marker(p,{icon:L.divIcon({className:'',html:`<div class="pin">${av(c)}</div>`,iconSize:[44,44],iconAnchor:[22,22]})}).addTo(map).bindTooltip(e(c.name)+(c.plate?' · '+e(c.plate):''));tr[r.courier_id]=L.polyline([],{color:'#000',weight:4}).addTo(map)}
  const t=tr[r.courier_id],ll=t.getLatLngs(),l=ll[ll.length-1];if(!l||l.lat!=r.lat||l.lng!=r.lng){t.addLatLng(p);mk[r.courier_id].setLatLng(p)}
  seen[r.courier_id]=r;$('#seen').innerHTML=Object.values(seen).map(x=>`${e((C.find(c=>c.id==x.courier_id)||{}).name)}: ${(q=>q>120?'⚠ SIN SEÑAL hace '+Math.round(q/60)+' min':'hace '+q+' s')(Math.round((Date.now()-new Date(x.updated_at))/1000))}`).join(' · ')};
 const load=async()=>{const{data}=await sb.from('locations').select('*');if(!data?.length){const s=$('#seen');if(s)s.textContent='Sin señal GPS: el domiciliario debe iniciar jornada.';return}data.forEach(put);if(!fit){fit=1;map.fitBounds(data.map(r=>[r.lat,r.lng]),{maxZoom:16,padding:[40,40]})}};

 $('#f').onsubmit=async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));
  const s2=supabase.createClient(cfg.u,cfg.k,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  const{error}=await s2.auth.signUp({email:d.email,password:d.pw,options:{data:{name:d.name,phone:d.phone,plate:d.plate.toUpperCase(),code:await inv()}}});

async function ahorro(){

 const[{data:cs},{data:st}]=await Promise.all([sb.from('order_costs').select('price,orders!inner(type,delivered_at)').gte('orders.delivered_at',a).lt('orders.delivered_at',b),sb.from('settings').select('*')]);
 const sal=+((st||[]).find(x=>x.key=='salary')||{}).value||0,tot=(cs||[]).reduce((s,x)=>s+x.price,0),sv=tot-sal;

async function endShift(){await sb.from('shifts').update({end_at:new Date().toISOString()}).eq('id',shift.id);stop();shiftUI()}
let lp,hb,bgw;
const BGP=()=>window.CUPISSA_BG||window.Capacitor?.Plugins?.BackgroundGeolocation||null;
function send(){if(!lp||!me)return;sb.from('locations').upsert({courier_id:me.id,lat:lp.lat,lng:lp.lng,acc:lp.acc,updated_at:new Date().toISOString()},{onConflict:'courier_id'}).then(r=>{if(r.error)console.warn('GPS:',r.error.message)})}
async function track(){if(wid!==null)return;const set=(la,ln,ac)=>{lp={lat:la,lng:ln,acc:ac};send()};
 if(BGP()&&window.Capacitor?.isNativePlatform?.()){try{await window.CUPISSA_NOTIFICATIONS?.requestPermissions?.();wid='bg';BGP().addWatcher({backgroundTitle:'CUPISSA DOMIS · Jornada activa',backgroundMessage:'Compartiendo ubicación con CUPISSA mientras tu jornada esté activa',requestPermissions:true,stale:false,distanceFilter:0},(l,er)=>{if(er){console.warn('GPS:',er.message||er);return}if(l)set(l.latitude,l.longitude,l.accuracy)}).then(id=>bgw=id).catch(er=>{wid=null;console.error(er);alert('No se pudo iniciar el GPS en segundo plano. Revisa los permisos de ubicación.')})}catch(er){wid=null;console.error(er);alert('No se pudieron solicitar los permisos de ubicación/notificaciones.')}}
 else{if(!navigator.geolocation)return alert('Este dispositivo no tiene GPS');wid=navigator.geolocation.watchPosition(p=>set(p.coords.latitude,p.coords.longitude,p.coords.accuracy),er=>console.warn(er.message),{enableHighAccuracy:true,maximumAge:0})}
 hb=setInterval(send,10000);navigator.wakeLock?.request('screen').then(w=>wl=w).catch(()=>{})}
function stop(){clearInterval(hb);if(bgw&&BGP())BGP().removeWatcher({id:bgw});bgw=null;if(typeof wid=='number')navigator.geolocation.clearWatch(wid);wid=null;wl?.release()}
document.addEventListener('visibilitychange',()=>{if(shift&&document.visibilityState=='visible'){navigator.wakeLock?.request('screen').then(w=>wl=w).catch(()=>{});send()}});
function tg(){const f=$('#f'),d=f.elements.type.value=='domicilio';f.querySelectorAll('.dom').forEach(x=>{x.style.display=d?'':'none';x.disabled=!d});f.elements.desc.placeholder=d?'Detalle del pedido':f.elements.type.value=='mandado'?'Describe el mandado':'Describe a dónde lo llevas / recoges'}
async function geo(a){const m=String(a).match(/^\s*(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)\s*$/);if(m)return[+m[1],+m[2]];
 try{const r=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=co&q='+encodeURIComponent(a+', Barranquilla'))).json();return r[0]?[+r[0].lat,+r[0].lon]:null}catch{return null}}
async function loadO(){const{data}=await sb.from('orders').select('id,type,client_name,client_phone,address,description,total,status,courier_id').neq('status','entregado').or(`courier_id.eq.${me.id},and(courier_id.is.null,status.eq.pendiente)`).order('created_at');
 $('#ol').innerHTML=(data||[]).map(o=>{const mine=o.courier_id==me.id,d=o.type=='domicilio';return `<div class="card"><div class="row"><b>${TYPES[o.type]||o.type}</b><span class="chip">${mine?ST[o.status]:'Disponible'}</span></div>
 ${d?`<div><b>${e(o.client_name)}</b> · <a href="tel:${e(o.client_phone)}">${e(o.client_phone)}</a></div><div>${e(o.address)}</div>`:''}<div class="${d?'mu':''}">${e(o.description)}</div>${d&&mine?`<div class="big">${money(o.total)}</div>`:''}
 <div class="row">${!mine?`<button onclick="accept('${o.id}')">✋ Aceptar</button>`:`${d?`<button class="s" onclick="nav('${o.id}')">🗺 Ruta</button><button class="s" onclick="qr(${o.total})">Cobrar QR</button><button class="s" onclick="comp('${o.id}')">💳 Comprobante</button>`:''}${o.status=='en_camino'?`<button onclick="deliver('${o.id}')">✔ Entregar</button>`:`<button onclick="go('${o.id}')">Salir</button>`}`}</div></div>`}).join('')||'<p class="mu">Sin pedidos.</p>'}
async function accept(id){const{data}=await sb.from('orders').update({courier_id:me.id,status:'asignado'}).eq('id',id).is('courier_id',null).select('id');if(!data?.length)alert('Otro domiciliario ya lo tomó');loadO()}
const MAN={left:'a la izquierda',right:'a la derecha',straight:'recto','slight left':'ligeramente a la izquierda','slight right':'ligeramente a la derecha','sharp left':'cerrado a la izquierda','sharp right':'cerrado a la derecha',uturn:'en U'};
const ins=s=>{const m=s.maneuver,t=m.type,w=MAN[m.modifier]||'',n=s.name?' por '+s.name:'';return t=='arrive'?'Llegaste al destino':t=='depart'?'Sal'+n:/roundabout|rotary/.test(t)?'Entra a la rotonda'+n:/turn|end of road|fork|ramp/.test(t)?'Gira '+w+n:'Continúa '+w+n};
function navX(){clearInterval(nt);if(nw!=null)navigator.geolocation.clearWatch(nw);nw=null;nmap?.remove();nmap=0;$('#navv')?.remove();speechSynthesis?.cancel()}
async function nav(id){const{data:o}=await sb.from('orders').select('address,dest_lat,dest_lng').eq('id',id).single();
 const d=o.dest_lat!=null?[o.dest_lat,o.dest_lng]:await geo(o.address);navX();
 const v=document.createElement('div');v.id='navv';v.style.cssText='position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column';
 v.innerHTML='<div id="nm" style="flex:1"></div><div style="padding:12px;border-top:1px solid #000"><div id="ni" class="mu">Calculando…</div><div class="row"><button class="s" onclick="navX()">✕ Cerrar mapa</button><button class="s" onclick="lp&&nmap.setView([lp.lat,lp.lng],17)">📍 Centrar</button></div></div>';
 document.body.appendChild(v);
 nmap=L.map('nm').setView(d||[10.96,-74.78],15);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(nmap);
 if(!d)return $('#ni').textContent='No pude ubicar la dirección. Pide al administrador que la escriba como coordenadas.';
 L.marker(d).addTo(nmap);let dot,rt,fit=1,key='';
 const upd=()=>{if(!lp||!nmap)return;dot?dot.setLatLng([lp.lat,lp.lng]):dot=L.circleMarker([lp.lat,lp.lng],{radius:9,color:'#fff',weight:3,fillColor:'#0a7',fillOpacity:1}).addTo(nmap)};
 const draw=async()=>{if(!lp||!nmap)return;try{const r=await(await fetch(`https://router.project-osrm.org/route/v1/driving/${lp.lng},${lp.lat};${d[1]},${d[0]}?overview=full&geometries=geojson&steps=true`)).json(),R=r.routes[0];if(!nmap)return;
  rt&&nmap.removeLayer(rt);rt=L.geoJSON(R.geometry,{style:{color:'#000',weight:6}}).addTo(nmap);upd();
  if(fit){fit=0;nmap.fitBounds(rt.getBounds(),{padding:[40,40]})}
  const st=R.legs[0].steps,nx=st[1]||st[0],tx=ins(nx);
  $('#ni').innerHTML=`<div class="big">${Math.round(st[0].distance)} m</div><b>${e(tx)}</b><div class="mu">${(R.distance/1000).toFixed(1)} km · ${Math.round(R.duration/60)} min al destino</div>`;
  if(tx!=key){key=tx;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(tx);u.lang='es-CO';speechSynthesis.speak(u)}catch{}}}catch{$('#ni').textContent='Sin ruta (revisa internet)'}};
 nw=navigator.geolocation.watchPosition(p=>{const first=!lp;lp={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};upd();if(first)draw()},()=>{$('#ni').textContent='Activa el permiso de ubicación'},{enableHighAccuracy:true,maximumAge:0});
 upd();draw();nt=setInterval(draw,12000)}
function comp(id){photo=null;openM(`<h3>Comprobante de transferencia</h3><button class="s" id="cb" onclick="cam()">📷 Abrir cámara trasera</button><video id="vid" autoplay playsinline muted style="display:none;width:100%;border-radius:8px"></video><button id="snap" style="display:none" onclick="snap()">Capturar</button><img id="prev" style="display:none"><div class="row"><button onclick="saveComp('${id}')">Enviar</button><button class="s" onclick="closeM()">Cancelar</button></div>`);cam()}
async function saveComp(id){if(!photo)return alert('Primero captura la foto');const{error}=await sb.from('orders').update({transfer_photo:photo}).eq('id',id);if(error)return alert(error.message);alert('Comprobante enviado');closeM()}
async function go(id){await sb.from('orders').update({status:'en_camino'}).eq('id',id);loadO()}
async function qr(t){const{data}=await sb.from('settings').select('value').eq('key','pay_qr').maybeSingle();
 openM(`<h3>Total a pagar</h3><div class="big">${money(t)}</div>${data?`<img src="${data.value}">`:'<p class="mu">El administrador aún no cargó el QR.</p>'}<button onclick="closeM()">Cerrar</button>`,{dismissible:false})}
function deliver(id){photo=null;dirty=0;openM(`<h3>Confirmar entrega</h3><button class="s" id="cb" onclick="cam()">📷 Tomar foto de la entrega</button><video id="vid" autoplay playsinline muted style="display:none;width:100%;border-radius:8px"></video><button id="snap" style="display:none" onclick="snap()">Capturar</button><img id="prev" style="display:none">
 <label class="mu">Firma del cliente</label><canvas id="sig"></canvas><div class="row"><button class="s" onclick="sigInit()">Borrar firma</button><button onclick="fin('${id}')">Marcar entregado</button></div><button class="s" onclick="closeM()">Cancelar</button>`);sigInit()}
function sigInit(){const c=$('#sig');c.width=c.offsetWidth;c.height=160;dirty=0;const x=c.getContext('2d');x.lineWidth=2.5;x.lineCap='round';x.strokeStyle='#000';let d=0;
 const p=v=>{const r=c.getBoundingClientRect();return[v.clientX-r.left,v.clientY-r.top]};
 c.onpointerdown=v=>{d=1;dirty=1;x.beginPath();x.moveTo(...p(v))};c.onpointermove=v=>{if(d){x.lineTo(...p(v));x.stroke()}};c.onpointerup=c.onpointerleave=()=>d=0}
async function fin(id){const{error}=await sb.from('orders').update({status:'entregado',delivered_at:new Date().toISOString(),photo:photo||null,signature:dirty?$('#sig').toDataURL('image/png'):null}).eq('id',id);
 if(error)return alert(error.message);closeM();loadO()}
</script></body></html>
