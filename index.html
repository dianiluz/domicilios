<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUTA CUPISSA · Domis</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json"><link rel="icon" href="logo/favicon.png"><link rel="apple-touch-icon" href="logo/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#fafafa;--card:#fff;--tx:#0a0a0a;--mu:#737373;--ac:#0a0a0a;--on:#fff;--bd:#e5e5e5;--rd:#b3261e}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;flex-wrap:wrap}
nav{display:flex;gap:6px;flex-wrap:wrap}main{max-width:900px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.narrow{max-width:380px;margin:12vh auto}
input,select,textarea,button{font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%;margin:4px 0}
button{background:var(--ac);color:var(--on);border:0;cursor:pointer;width:auto}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.rd{background:var(--rd);color:var(--on)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:700}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:12px;z-index:50}
#modal>div{background:var(--card);border-radius:14px;padding:16px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
#sig{width:100%;height:160px;border:1px dashed var(--mu);border-radius:8px;touch-action:none;background:#fff}
img{max-width:100%;border-radius:8px}#map{height:320px;border-radius:12px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;background:var(--ac);color:var(--on);font-weight:700;vertical-align:middle;cursor:pointer}
.pin{border:3px solid var(--ac);border-radius:50%;background:#fff;width:44px;height:44px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0006}.pin .av{width:38px;height:38px}
body{font:15px/1.5 -apple-system,"Helvetica Neue",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
h2,h3{margin:.2em 0 .5em;font-weight:600;letter-spacing:-.02em}
header{background:#ffffffe6;backdrop-filter:blur(10px);border-bottom:1px solid var(--tx)}
.card{border-radius:14px;box-shadow:0 1px 2px #0000000d,0 8px 24px -12px #00000014}
input,select,textarea{border-radius:10px;border-color:var(--bd);background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tx);box-shadow:0 0 0 3px #0000001a}
button{border-radius:999px;padding:9px 18px;font-weight:500;letter-spacing:.01em;transition:opacity .15s,transform .05s}
button:hover{opacity:.85}button:active{transform:scale(.98)}
button.s{background:#fff;color:var(--tx);border:1px solid var(--tx)}button.rd{background:#fff;color:var(--rd);border:1px solid var(--rd)}
.chip{text-transform:uppercase;font-size:11px;letter-spacing:.06em;border-color:var(--tx);color:var(--tx);padding:2px 10px}
.big{font-weight:600;letter-spacing:-.03em}.mu{color:var(--mu)}
th{text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--mu);font-weight:500}
a{color:var(--tx)}hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
#map{border:1px solid var(--tx)}
.pin{border-color:#000}.av{background:#000;color:#fff}

.ac{position:relative}.ac ul{position:absolute;left:0;right:0;top:100%;z-index:40;margin:2px 0 0;padding:4px;list-style:none;background:#fff;border:1px solid var(--tx);border-radius:10px;box-shadow:0 8px 24px -8px #0004;max-height:260px;overflow:auto;display:none}
.ac li{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1.3}.ac li:hover,.ac li.on{background:#0000000f}.ac li small{display:block;color:var(--mu)}
.ac .ok{color:#0a7;font-size:13px}.ac .no{color:var(--rd);font-size:13px}

/* Vista de clientes: integración conservando los estilos originales */
#modal:has(#wazeMapWrap)>div{max-width:min(96vw,800px)}
.ruta-cliente{max-width:1060px}.ruta-cliente .ruta-head{background:linear-gradient(110deg,#13091b,#25112a);color:#fff;border-color:#8d477b}.ruta-head h2{color:#fff}.ruta-head .mu{color:#ddd}
.ruta-actions .card{background:#171022;color:#fff;border-color:#b94183}.ruta-actions .card .mu{color:#d2becb}.ruta-actions .card button{background:#db137a;color:#fff}.ruta-kpis .big{color:#b90068}.ruta-chat-msg{background:#f2edf2;border-radius:12px;padding:10px;margin:6px 0;max-width:85%;overflow-wrap:anywhere}.ruta-chat-msg.own{background:#f8cde3;margin-left:auto}.ruta-chat-msg small{display:block;font-size:10px;opacity:.7}

/* Etapas operativas del domiciliario: orden estable y legible en móvil */
.delivery-flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.delivery-step{min-width:0;border:1px solid #e5d8e2;background:#fff8fc;border-radius:14px;padding:10px}
.delivery-step .step-title{font-weight:750;color:#781043;font-size:13px;margin-bottom:8px}
.delivery-step .step-actions{display:flex;flex-wrap:wrap;gap:7px}
.delivery-step button{flex:1 1 112px;border-radius:10px;padding:10px 8px;font-size:13px;white-space:normal;line-height:1.25;margin:0}
.delivery-step .primary-action{background:#b41569;color:#fff}
.delivery-step .finish-action{background:#136c53;color:#fff}
.delivery-step .step-help{display:block;font-size:11px;color:#655b63;margin:7px 0 0}
@media(max-width:530px){.delivery-flow{grid-template-columns:1fr}.delivery-step{padding:12px}.delivery-step button{min-height:42px}}

<script>
const $=s=>document.querySelector(s),app=$('#app');
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('es-CO'),fdt=d=>d?new Date(d).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'}):'—';
const TYPES={domicilio:'Domicilio',mandado:'Mandado',traslado:'Llevarme a un lugar'};
const ST={pendiente:'Pendiente',asignado:'Asignado',en_camino:'En camino',entregado:'Entregado'};
var nt,nmap,nw;let modalLocked=false;const openM=(h,opts={})=>{modalLocked=opts.dismissible===false;$('#modal>div').innerHTML='<button class="s" onclick="closeM()" style="float:right;position:sticky;top:0;z-index:9">✕</button>'+h;$('#modal').style.display='flex'},closeM=()=>{if(window._rutaPickMap){window._rutaPickMap.remove();window._rutaPickMap=null}window.confirmExactDestination=undefined;$('#modal').style.display='none';modalLocked=false;if(window.chCh){sb.removeChannel(window.chCh);window.chCh=0}clearInterval(window.chT);window.chDraw=null;try{stm?.getTracks().forEach(t=>t.stop())}catch{}};
$('#modal').addEventListener('click',ev=>{if(ev.target.id=='modal'&&!modalLocked)closeM()});addEventListener('keydown',ev=>{if(ev.key=='Escape'&&!modalLocked)closeM()});
const shrink=(f,w,q)=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};i.src=URL.createObjectURL(f)});
const cfg=Object.freeze({u:'https://twrzhqrnnzzeznxrvgzd.supabase.co',k:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3cnpocXJubnp6ZXpueHJ2Z3pkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5MjMzMTQsImV4cCI6MjEwOTQ5OTMxNH0.dm7R81ncvyOqxhI8ih1Il8ZqUQphOhY61wdV2_dMC4Y'});
let stm,tmr,ip,sb,me,C=[],chan,map,poll;window.sb=null;

const av=c=>c.avatar?`<img class="av" src="${c.avatar}">`:`<span class="av">${e((c.name||'?')[0])}</span>`;
const APK_URL='/app/CUPISSA-DOMIS.apk';
const insB=()=>window.Capacitor?.isNativePlatform?.()?'':`<button id="ins" class="s" onclick="dl()">⬇ Descargar app</button>`;
addEventListener('beforeinstallprompt',v=>{v.preventDefault();ip=v});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
async function inv(){const{data,error}=await sb.from('settings').select('value').eq('key','invite').maybeSingle();if(error)throw Error('No se pudo consultar el código de invitación: '+error.message);if(data?.value)return data.value;const v=crypto.randomUUID().slice(0,12);const{error:saveError}=await sb.from('settings').upsert({key:'invite',value:v},{onConflict:'key'});if(saveError)throw Error('No se pudo crear el código de invitación: '+saveError.message);return v}
async function plate(id){await sb.from('profiles').update({plate:$('#pl'+id).value.toUpperCase()}).eq('id',id);alert('Placa guardada')}
async function delo(id){if(!confirm('¿Eliminar este servicio?'))return;await sb.from('orders').delete().eq('id',id);tab('pedidos')}
async function delall(){if(prompt('Esto borra TODOS los servicios. Escribe BORRAR para confirmar')!='BORRAR')return;await sb.from('orders').delete().neq('id','00000000-0000-0000-0000-000000000000');tab('pedidos')}
async function setAv(f){if(!f)return;me.avatar=await shrink(f,200,.8);await sb.from('profiles').update({avatar:me.avatar}).eq('id',me.id);courier()}
async function cam(){try{if(window.CUPISSA_CAMERA&&window.Capacitor?.isNativePlatform?.()){const shot=await window.CUPISSA_CAMERA.getPhoto({quality:85});if(!shot?.dataUrl)throw new Error('No se capturó la fotografía');photo=shot.dataUrl;$('#prev').src=photo;$('#prev').style.display='block';$('#vid').style.display='none';$('#snap').style.display='none';$('#cb').style.display='inline-block';$('#cb').textContent='📷 Repetir foto';return;}try{stm=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{exact:'environment'}}})}catch{stm=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}})}const v=$('#vid');v.srcObject=stm;v.style.display='block';await v.play();$('#snap').style.display='inline-block';$('#cb').style.display='none'}catch(err){alert('No se pudo abrir la cámara trasera. Revisa el permiso del navegador. '+(err?.message||''))}}
function snap(){const v=$('#vid'),c=document.createElement('canvas'),k=Math.min(1,800/v.videoWidth);c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext('2d').drawImage(v,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.6);stm.getTracks().forEach(t=>t.stop());v.style.display='none';$('#snap').style.display='none';$('#prev').src=photo;$('#prev').style.display='block';$('#cb').style.display='inline-block';$('#cb').textContent='📷 Repetir foto'}
init();

async function init(){try{sb=supabase.createClient(cfg.u,cfg.k);window.sb=sb;const{data:{session}}=await sb.auth.getSession();session?start(session.user):login()}catch(err){app.innerHTML='<div class="card narrow"><h2>No se pudo iniciar CUPISSA DOMIS</h2><p class="mu">Revisa tu conexión a internet e inténtalo de nuevo.</p></div>';console.error(err)}}
function login(){if(new URLSearchParams(location.search).get('portal')==='cliente'){location.replace('clientes/');return}app.innerHTML=`<div class="card narrow" style="text-align:center"><img src="logo/logo.png" alt="Cupissa" style="max-height:70px;margin-bottom:8px" onerror="this.style.display='none'"><h2>RUTA CUPISSA</h2><p class="mu">Acceso administrativo y de conductores</p><input id="em" type="email" placeholder="Correo"><input id="pw" type="password" placeholder="Contraseña (mín. 6)"><div class="row"><button onclick="auth(1)">Entrar</button></div><hr><p class="mu">¿Necesitas solicitar un servicio?</p><a href="clientes/"><button class="s">Entrar al portal de clientes</button></a>${insB()}</div>`}
async function auth(inn){const em=$('#em').value,pw=$('#pw').value;const r=inn?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw});
 if(r.error)return alert(r.error.message);if(!r.data.session)return alert('Revisa tu correo para confirmar (o desactiva la confirmación en Supabase).');start(r.data.user)}
async function out(){stop();clearInterval(poll);await sb.auth.signOut();location.reload()}
async function start(u){const{data:staff,error:se}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();if(staff?.role==='admin'||staff?.role==='courier'){me=staff;if(me.active===false){await sb.auth.signOut();return alert('Esta cuenta fue desactivada')}return me.role==='admin'?admin():courier()}const{data:customer}=await sb.from('ruta_clientes').select('*').eq('id',u.id).maybeSingle();if(customer){me={...customer,role:'passenger',name:customer.full_name||u.email};location.replace('clientes/');return}await sb.auth.signOut();login();alert('Esta cuenta no tiene acceso al panel de personal. Los clientes ingresan desde el portal de clientes.')}

/* ---------- ADMIN ---------- */
function admin(){app.innerHTML=`<header><span><img src="logo/logo.png" height="28" style="vertical-align:middle" onerror="this.style.display='none'"> <b>Cupissa Domis</b></span><nav>${[['pedidos','Servicios'],['equipo','Equipo y mapa'],['jornadas','Jornadas'],['mensajes','Mensajes'],['ahorro','Ahorro'],['clientes','Clientes y solicitudes']].map(t=>`<button class="s" onclick="tab('${t[0]}')">${t[1]}${t[0]=='mensajes'?'<b id="mb"></b>':''}</button>`).join('')}</nav><span>${insB()} <button class="s" onclick="out()">Salir</button></span></header><main id="m"></main>`;tab('pedidos');adminMsgs()}
async function tab(t){window.curTab=t;clearInterval(tmr);if(chan){sb.removeChannel(chan);chan=0}if(map){map.remove();map=0}$('#m').innerHTML='Cargando…';await({pedidos,equipo,jornadas,mensajes,ahorro,clientes})[t]()}
const copts=s=>`<option value="">Sin asignar</option>`+C.map(c=>`<option value="${c.id}" ${c.id==s?'selected':''}>${e(c.name)}</option>`).join('');

async function pedidos(){
 const[a,b]=await Promise.all([sb.from('profiles').select('*').eq('role','courier'),sb.from('orders').select('id,type,client_name,client_phone,address,description,total,courier_id,status,created_at,delivered_at').order('created_at',{ascending:false}).limit(60)]);
 C=(a.data||[]).filter(x=>x.active!==false);const os=b.data||[];
 $('#m').innerHTML=`<section class="card"><div class="row"><h3>Nuevo servicio</h3><button class="rd" onclick="delall()">Borrar todos</button></div><form id="f"><div class="g">
 <select name="type" onchange="tg()">${Object.entries(TYPES).map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select>
 <input name="name" placeholder="Nombre del cliente"><input name="phone" placeholder="Teléfono" inputmode="tel">
 <div class="ruta-address-panel"><h4>Destino y dirección de entrega</h4><div class="address-controls"><label for="municipio" class="mu">Municipio<select id="municipio" name="municipio" aria-label="Municipio de destino"><option value="Barranquilla">Barranquilla</option><option value="Soledad">Soledad</option><option value="Malambo">Malambo</option><option value="Puerto Colombia">Puerto Colombia</option><option value="Galapa">Galapa</option></select></label><div class="ac"><input name="address" id="adr" placeholder="🔍 Buscar dirección o lugar (ej: Calle 72 # 46-30 o Éxito Buenavista)" autocomplete="off" required><input type="hidden" name="lat"><input type="hidden" name="lng"><ul id="adl"></ul><div id="ads" class="address-confidence" data-state="warn">Busca por calle/carrera y número. Confirma siempre la ubicación antes de enviar.</div></div></div><div class="ruta-address-meta"><button type="button" class="s" onclick="importarUbicacion()">Pegar ubicación de WhatsApp o Maps</button><button type="button" class="s" onclick="pickExactDestination()">Elegir entrada exacta en el mapa</button><button type="button" class="s" onclick="showSavedAddresses()">Mis direcciones guardadas</button></div><small class="mu">Ejemplo: Calle 72 # 46-30. Para edificios, barrios y conjuntos agrega una referencia.</small></div>
 <input name="total" type="number" placeholder="Total a cobrar" inputmode="numeric"><input name="cost" type="number" placeholder="🔒 Precio oculto (lo que pagarías)" inputmode="numeric">
 <select name="courier">${copts()}</select><label class="mu" style="display:block">📅 Fecha y hora del servicio<input type="datetime-local" name="when" required value="${new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16)}"></label></div><textarea name="desc" placeholder="Detalle del pedido / mandado"></textarea><button>Crear servicio</button></form></section>
 ${os.map(o=>`<div class="card"><div class="row"><b>${TYPES[o.type]||o.type} · ${e(o.client_name)}</b><span class="chip">${ST[o.status]}</span></div>
 <div class="mu">${e(o.address)} · ${e(o.client_phone)}</div><div>${e(o.description)}</div>
 <div class="row"><b>${money(o.total)}</b><span class="mu">📅 ${fdt(o.created_at)}${o.delivered_at?' · ✔ Entregado '+fdt(o.delivered_at):''}</span></div>
 <div class="row"><select style="width:auto" onchange="assign('${o.id}',this.value)">${copts(o.courier_id)}</select><button class="s" onclick="abrirRutaAdmin('${o.id}')">Ver ruta en mapa</button>${o.courier_id?`<button class="s" onclick="chat('${o.courier_id}','${o.id}')">💬 Chat</button>`:''}<button class="rd" onclick="delo('${o.id}')">🗑 Eliminar</button>${o.status=='entregado'?`<button class="s" onclick="evid('${o.id}')">Ver evidencia</button>`:`<button class="s" onclick="evid('${o.id}')">Ver comprobante</button>`}</div></div>`).join('')||'<p class="mu">Sin servicios aún.</p>'}`;
 tg();addrSearch();$('#f').onsubmit=async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));
  let g=d.lat&&d.lng?[+d.lat,+d.lng]:null;if(d.address&&!g&&!confirm('No has confirmado la ubicación en el mapa. ¿Crear servicio sin GPS de destino? Para una ruta confiable usa «Ubicar dirección exacta en el mapa».'))return;const{data:o,error}=await sb.from('orders').insert({type:d.type,created_at:d.when?new Date(d.when).toISOString():new Date().toISOString(),client_name:d.name||'',client_phone:d.phone||'',address:(d.address?(d.address+', '+(d.municipio||'Barranquilla')+', Atlántico'):'') ,dest_lat:g?g[0]:null,dest_lng:g?g[1]:null,description:d.desc,total:+d.total||0,courier_id:d.courier||null,status:d.courier?'asignado':'pendiente'}).select('id').single();
  if(error)return alert(error.message);if(g&&$('#ads')?.dataset.verified==='1')await window.RutaDirecciones.saveConfirmed(d.address,d.municipio,g[0],g[1]);if(d.cost)await sb.from('order_costs').insert({order_id:o.id,price:+d.cost});tab('pedidos')}}
async function abrirRutaAdmin(id){const{data,error}=await sb.from('orders').select('id,address,dest_lat,dest_lng').eq('id',id).single();if(error||!data)return alert('No se pudo cargar el destino.');window.RutaNavegacion.open(data,{admin:true});}
async function assign(id,c){await sb.from('orders').update({courier_id:c||null,status:c?'asignado':'pendiente'}).eq('id',id);tab('pedidos')}
async function evid(id){const{data}=await sb.from('orders').select('photo,signature,transfer_photo').eq('id',id).single();
 openM(`<h3>Evidencia</h3>${data.transfer_photo?`<p class="mu">Comprobante de transferencia</p><img src="${data.transfer_photo}">`:'<p class="mu">Sin comprobante</p>'}${data.photo?`<img src="${data.photo}">`:'<p class="mu">Sin foto</p>'}${data.signature?`<p class="mu">Firma del cliente</p><div style="background:#fff;border-radius:8px"><img src="${data.signature}"></div>`:'<p class="mu">Sin firma</p>'}<button onclick="closeM()">Cerrar</button>`)}

async function equipo(){
 const{data:cs}=await sb.from('profiles').select('*').eq('role','courier');C=(cs||[]).filter(x=>x.active!==false);

 const {data,error}=await sb.from('mensajes_chat').select('sender_role,message,created_at').eq('passenger_id',me.id).order('created_at',{ascending:true}).limit(150);
 if(error){box.textContent=error.message;return}
 box.innerHTML=(data||[]).map(x=>`<div class="ruta-chat-msg ${x.sender_role==='passenger'?'own':''}"><span>${e(x.message)}</span><small>${fdt(x.created_at)}</small></div>`).join('')||'<p class="mu">No hay mensajes. Escribe para iniciar una conversación.</p>';box.scrollTop=box.scrollHeight;
}
async function enviarChatCliente(ev){ev.preventDefault();const f=ev.currentTarget,msg=f.elements.msg.value.trim();if(!msg)return;
 const {error}=await sb.from('mensajes_chat').insert({passenger_id:me.id,sender_role:'passenger',message:msg});if(error)return alert(error.message);f.reset();cargarChatCliente();}
async function clientes(){
 const [a,b]=await Promise.all([sb.from('solicitudes_servicio').select('*').order('created_at',{ascending:false}).limit(100),sb.from('ruta_clientes').select('id,full_name,email').order('created_at',{ascending:false})]);
 if(a.error||b.error){$('#m').textContent='Error al cargar solicitudes de clientes: '+(a.error||b.error).message;return}
 const users=b.data||[],requests=a.data||[];
 $('#m').innerHTML=`<section class="card"><h2>Clientes y solicitudes</h2><div class="mu">${users.length} clientes registrados · ${requests.filter(r=>r.status==='pendiente').length} solicitudes pendientes</div></section><section class="card"><h3>Solicitudes de clientes</h3><div style="overflow-x:auto"><table><thead><tr><th>Cliente</th><th>Fecha</th><th>Origen → destino</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${requests.map(r=>{const u=users.find(x=>x.id===r.passenger_id);return `<tr><td>${e(u?.full_name||u?.email||'Cliente')}</td><td>${e(r.date)} ${e(r.time)}</td><td>${e(r.origin)} → ${e(r.destination)}</td><td>${e(r.status)}</td><td><button class="s" onclick="abrirWaze(decodeURIComponent('${encodeURIComponent(r.destination).replace(/'/g,'%27')}'))">Ver ruta</button>${r.status==='pendiente'?` <button onclick="aprobarRuta('${r.id}')">Aprobar</button> <button class="rd" onclick="rechazarRuta('${r.id}')">Rechazar</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="5">No hay solicitudes.</td></tr>'}</tbody></table></div></section><section class="card"><h3>Mensajes de clientes</h3><select id="rutaAdminCliente" onchange="cargarChatAdminCliente()"><option value="">Elegir cliente</option>${users.map(x=>`<option value="${e(x.id)}">${e(x.full_name||x.email)}</option>`).join('')}</select><div id="rutaAdminChat" style="max-height:300px;overflow:auto;margin:12px 0"></div><form onsubmit="enviarChatAdminCliente(event)"><div class="row"><input name="msg" maxlength="2000" placeholder="Responder al cliente" required><button>Enviar</button></div></form></section>`;
}
async function aprobarRuta(id){const {data:r,error:re}=await sb.from('solicitudes_servicio').select('*').eq('id',id).single();if(re)return alert(re.message);
 const priceText=prompt('Precio acordado para el cliente en COP (no cobro automático):');if(priceText===null)return;
 const price=Number(priceText);if(!Number.isFinite(price)||price<0)return alert('Precio inválido.');
 const {error}=await sb.from('servicios_transporte').insert({passenger_id:r.passenger_id,date:r.date,time:r.time,origin:r.origin,destination:r.destination,price,driver_type:'Conductor Interno'});
 if(error)return alert('No se pudo crear el servicio: '+error.message);
 const updated=await sb.from('solicitudes_servicio').update({status:'aprobado'}).eq('id',id);if(updated.error)return alert('Servicio creado, pero no se pudo actualizar la solicitud: '+updated.error.message);
 clientes();
}
async function rechazarRuta(id){if(!confirm('¿Rechazar esta solicitud?'))return;const {error}=await sb.from('solicitudes_servicio').update({status:'rechazado'}).eq('id',id);if(error)return alert(error.message);clientes()}
async function cargarChatAdminCliente(){const id=$('#rutaAdminCliente')?.value,box=$('#rutaAdminChat');if(!id||!box)return;
 const {data,error}=await sb.from('mensajes_chat').select('sender_role,message,created_at').eq('passenger_id',id).order('created_at',{ascending:true}).limit(150);
 if(error){box.textContent=error.message;return}
 box.innerHTML=(data||[]).map(x=>`<div class="ruta-chat-msg ${x.sender_role==='admin'?'own':''}">${e(x.message)}<small>${fdt(x.created_at)}</small></div>`).join('')||'<p class="mu">No hay mensajes de este cliente.</p>';
}
async function enviarChatAdminCliente(ev){ev.preventDefault();const id=$('#rutaAdminCliente')?.value,f=ev.currentTarget,msg=f.elements.msg.value.trim();if(!id)return alert('Selecciona un cliente');if(!msg)return;
 const {error}=await sb.from('mensajes_chat').insert({passenger_id:id,sender_role:'admin',message:msg});if(error)return alert(error.message);f.reset();cargarChatAdminCliente();}

</script></body></html>
