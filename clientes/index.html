<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes | RUTA CUPISSA</title><meta name="theme-color" content="#14081b"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Arial;background:linear-gradient(130deg,#09050c,#25102b 62%,#0d0612);color:#f9f1f7;min-height:100vh}main{max-width:1100px;margin:0 auto;padding:24px 16px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 20px;border-bottom:1px solid #70335b}header a{color:#eac1d6}h1{font-size:26px;margin:2px 0 12px}.auth{max-width:480px;margin:7vh auto;padding:26px;background:#1c1024;border:1px solid #75315d;border-radius:20px;box-shadow:0 20px 55px #0006}label{display:block;margin:12px 0 4px;color:#e5ccda}input{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid #66344f;border-radius:10px;background:#12091a;color:#fff;font:inherit}button{cursor:pointer;background:#df177d;color:white;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:650}button.secondary{background:transparent;border:1px solid #cf72a5}button:disabled{opacity:.5;cursor:wait}.buttons{display:grid;gap:9px;margin:16px 0}.muted{color:#d1b8c9}.msg{white-space:pre-wrap;padding:10px;border-radius:9px;background:#452038;margin:12px 0}.hide{display:none!important}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card{border:1px solid #683453;background:#160d1e;border-radius:15px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.stat{font-size:27px;font-weight:bold;color:#ff82c0}table{border-collapse:collapse;width:100%}th,td{padding:9px;border-bottom:1px solid #66405b;text-align:left}th{color:#d9b3c9;font-size:12px}a{color:#ff91c8}dialog{background:#1d1225;color:#fff;border:1px solid #ab5184;border-radius:16px;padding:20px;max-width:min(95vw,540px);width:100%}dialog::backdrop{background:#000b}#wazeDialog{max-width:min(95vw,760px)}.chat{height:270px;overflow:auto}.bubble{padding:8px 12px;margin:6px 0;border-radius:10px;background:#38243f;overflow-wrap:anywhere}.bubble.mine{background:#663054;margin-left:15%}small{color:#dbbace}nav{display:flex;gap:8px;align-items:center}nav button{padding:8px 12px}@media(max-width:640px){.auth{margin:2vh auto;padding:17px}table{font-size:12px}}
</style></head><body><header><b>RUTA CUPISSA · CLIENTES</b><nav><a href="../">Personal</a><button class="secondary hide" id="logout" onclick="logout()">Salir</button></nav></header><main id="root"><div class="auth">Cargando…</div></main>
<dialog id="serviceDialog"><h2>Solicitar servicio</h2><form id="serviceForm"><label>Fecha<input name="date" type="date" required></label><label>Hora<input name="time" type="time" required></label><label>Origen<input name="origin" required maxlength="250" placeholder="Dirección y municipio"></label><label>Destino<input name="destination" required maxlength="250" placeholder="Dirección y municipio"></label><div class="row"><button>Enviar solicitud</button><button type="button" class="secondary" onclick="serviceDialog.close()">Cancelar</button></div></form></dialog>
<dialog id="chatDialog"><h2>Chat de soporte</h2><div id="chatBox" class="chat"></div><form id="chatForm" class="row"><input id="chatInput" maxlength="2000" required placeholder="Escribe tu mensaje" style="flex:1"><button>Enviar</button></form><button class="secondary" onclick="chatDialog.close()">Cerrar</button></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="../js/ruta-config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script src="../js/mapa-compartido.js?v=10"></script><script src="../js/navegacion-config.js?v=10"></script><script src="../js/navegacion-ruta.js"></script><script>
const $=s=>document.querySelector(s),root=$('#root');const sdb=window.supabase.createClient(window.RUTA_CONFIG.url,window.RUTA_CONFIG.anon);let user=null,profile=null,services=[],abonos=[],requests=[],chat=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cop=x=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(x||0));const notify=s=>{let el=$('#notice');if(!el){el=document.createElement('p');el.id='notice';el.className='msg';root.prepend(el)}el.textContent=s};
function loginUI(register=false){user=null;$('#logout').classList.add('hide');root.innerHTML=`<section class="auth"><h1>${register?'Crear cuenta':'Bienvenido a RUTA CUPISSA'}</h1><p class="muted">Portal exclusivo de clientes</p><form id="authForm">${register?'<label>Nombre completo<input name="name" required maxlength="120" autocomplete="name"></label>':''}<label>Correo electrónico<input type="email" name="email" required autocomplete="email"></label><label>Contraseña<input type="password" name="password" required minlength="8" autocomplete="${register?'new-password':'current-password'}"></label><div class="buttons"><button type="submit">${register?'Registrar cliente':'Iniciar sesión'}</button></div></form><div class="buttons"><button class="secondary" onclick="loginUI(${!register})">${register?'Ya tengo cuenta':'Crear cuenta de cliente'}</button></div></section>`;$('#authForm').addEventListener('submit',ev=>sendAuth(ev,register))}
async function sendAuth(ev,register){ev.preventDefault();const f=ev.currentTarget,b=f.querySelector('button'),email=f.elements.email.value.trim(),password=f.elements.password.value;b.disabled=true;try{if(register){const full_name=f.elements.name.value.trim();if(!full_name)throw Error('Ingresa el nombre.');const{data,error}=await sdb.auth.signUp({email,password,options:{data:{full_name,name:full_name,ruta_cliente:true}}});if(error)throw error;if(!data.session){notify('Cuenta creada. Si Supabase exige confirmación de correo, confirma el correo e inicia sesión.');return}await sessionStarted(data.user)}else{const{data,error}=await sdb.auth.signInWithPassword({email,password});if(error)throw error;await sessionStarted(data.user)}}catch(err){notify('No fue posible ingresar o registrar la cuenta: '+err.message+' (Si aparece Database error saving new user, ejecuta el diagnóstico SQL de triggers incluido en el ZIP.)')}finally{b.disabled=false}}
async function sessionStarted(u){user=u;const{data:staff,error:sterr}=await sdb.from('profiles').select('role').eq('id',u.id).maybeSingle();if(sterr)throw sterr;if(staff?.role==='admin'||staff?.role==='courier'){await sdb.auth.signOut();loginUI();notify('Este acceso es solo para clientes. Para entrar como personal utiliza la página principal.');return}
 const{data:existing,error:existErr}=await sdb.from('ruta_clientes').select('*').eq('id',u.id).maybeSingle();if(existErr)throw existErr;
 if(existing){profile=existing}else{const name=u.user_metadata?.full_name||u.user_metadata?.name||u.user_metadata?.full_name||u.email?.split('@')[0]||'Cliente';const{data,error}=await sdb.from('ruta_clientes').insert({id:u.id,full_name:String(name).slice(0,120),email:u.email||''}).select().single();if(error)throw Error('La autenticación funcionó, pero no se pudo crear el perfil de cliente: '+error.message);profile=data}dashboard()}
async function logout(){await sdb.auth.signOut();loginUI()}
function dashboard(){root.innerHTML=`<section class="card"><div class="row"><div><h1>Mi panel de servicios</h1><p class="muted" id="welcome"></p></div><label>Mes<input type="month" id="month" onchange="render()"></label></div></section><section class="grid"><div class="card"><h2>Solicitar servicio</h2><p class="muted">Programa tu solicitud.</p><button onclick="newService()">+ Solicitar</button></div><div class="card"><h2>Chat directo</h2><p class="muted">Comunícate con soporte.</p><button onclick="showChat()">Abrir chat</button></div></section><section class="grid"><div class="card"><p class="muted">Servicios totales</p><div class="stat" id="kCount">0</div></div><div class="card"><p class="muted">Saldo pendiente</p><div class="stat" id="kDue">$0</div><small id="kPaid"></small></div><div class="card"><p class="muted">Último servicio</p><b id="kLast">Sin registros</b></div></section><section class="card"><div class="row"><h2>Mis servicios</h2><button class="secondary" onclick="loadAll()">Actualizar</button></div><div style="overflow:auto"><table><thead><tr><th>Fecha/hora</th><th>Trayecto</th><th>Precio</th><th>Ruta</th></tr></thead><tbody id="history"></tbody></table></div></section><section class="card"><h2>Solicitudes enviadas</h2><div id="requests"></div></section>`;$('#logout').classList.remove('hide');$('#welcome').textContent='Hola, '+(profile.full_name||user.email);let d=new Date;$('#month').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');loadAll()}
async function loadAll(){const [a,b,c]=await Promise.all([sdb.from('servicios_transporte').select('*').eq('passenger_id',user.id).order('date',{ascending:false}),sdb.from('abonos_pasajero').select('*').eq('passenger_id',user.id),sdb.from('solicitudes_servicio').select('*').eq('passenger_id',user.id).order('created_at',{ascending:false})]);if(a.error||b.error||c.error)return notify((a.error||b.error||c.error).message);services=a.data||[];abonos=b.data||[];requests=c.data||[];render()}
function render(){const month=$('#month')?.value||'',filtered=services.filter(x=>!month||String(x.date).startsWith(month));$('#kCount').textContent=filtered.length;$('#kDue').textContent=cop(Math.max(0,services.reduce((n,x)=>n+Number(x.price||0),0)-abonos.reduce((n,x)=>n+Number(x.amount||0),0)));$('#kPaid').textContent='Abonado: '+cop(abonos.reduce((n,x)=>n+Number(x.amount||0),0));$('#kLast').textContent=services[0]?services[0].date+' · '+services[0].origin+' → '+services[0].destination:'Sin registros';let body=$('#history');body.replaceChildren();if(!filtered.length){body.innerHTML='<tr><td colspan="4">No hay servicios este mes.</td></tr>'}filtered.forEach(x=>{const row=document.createElement('tr');[x.date+' '+(x.time||''),x.origin+' → '+x.destination,cop(x.price)].forEach(t=>{const c=document.createElement('td');c.textContent=t;row.append(c)});const c=document.createElement('td'),btn=document.createElement('button');btn.className='secondary';btn.textContent='Ruta';btn.addEventListener('click',()=>RutaNavegacion.open({address:x.destination}));c.append(btn);row.append(c);body.append(row)});$('#requests').replaceChildren();if(!requests.length)$('#requests').textContent='Aún no tienes solicitudes.';requests.forEach(x=>{let el=document.createElement('p');el.textContent=`${x.date} ${x.time} · ${x.origin} → ${x.destination} · ${x.status}`;$('#requests').append(el)})}
function newService(){const d=new Date;$('#serviceForm').elements.date.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');serviceDialog.showModal()}
$('#serviceForm').addEventListener('submit',async ev=>{ev.preventDefault();const f=ev.currentTarget,b=f.querySelector('button');b.disabled=true;const payload={passenger_id:user.id,date:f.elements.date.value,time:f.elements.time.value,origin:f.elements.origin.value.trim(),destination:f.elements.destination.value.trim(),status:'pendiente'};const{error}=await sdb.from('solicitudes_servicio').insert(payload);b.disabled=false;if(error)return notify(error.message);serviceDialog.close();f.reset();await loadAll();notify('Solicitud enviada a administración. Sin cobro automático.')});
async function showChat(){chatDialog.showModal();await loadChat()}
async function loadChat(){const{data,error}=await sdb.from('mensajes_chat').select('*').eq('passenger_id',user.id).order('created_at',{ascending:true});if(error)return notify(error.message);$('#chatBox').replaceChildren();(data||[]).forEach(x=>{const div=document.createElement('div');div.className='bubble'+(x.sender_role==='passenger'?' mine':'');div.textContent=x.message;$('#chatBox').append(div)});$('#chatBox').scrollTop=$('#chatBox').scrollHeight}
$('#chatForm').addEventListener('submit',async ev=>{ev.preventDefault();const msg=$('#chatInput').value.trim();if(!msg)return;const{error}=await sdb.from('mensajes_chat').insert({passenger_id:user.id,sender_role:'passenger',message:msg});if(error)return notify(error.message);$('#chatInput').value='';await loadChat()});
(async()=>{const{data:{session}}=await sdb.auth.getSession();if(session){try{await sessionStarted(session.user)}catch(err){loginUI();notify(err.message)}}else loginUI()})();
</script></body></html>
